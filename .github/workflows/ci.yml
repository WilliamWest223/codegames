name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, tests, e2e
    runs-on: ubuntu-latest
    # The e2e suite alone takes ~20 min on one worker.
    # shortcut: one long job; shard Playwright across a matrix if it passes ~35 min.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
      - name: Typecheck
        run: npm run typecheck
      - name: Unsafe sink ban (scripts/check-sinks.mjs)
        run: npm run check:sinks
      - name: Unsafe sink ban self-test
        run: npm run check:sinks -- --self-test
      - name: Security lint (ESLint)
        run: npm run lint
      - name: Unit + curriculum tests (runs every level solution in Python and JavaScript)
        run: npm test
      - name: Date logic under a daylight-saving timezone
        run: TZ=America/New_York npm test --workspace @codegames/web
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7

  gitleaks:
    name: Secret scan and mirror dry run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-gitleaks
      - name: Scan full git history
        run: gitleaks git --redact --no-banner --verbose .
      # Dry-run of the public export against the REAL allowlist: a denylisted path or a
      # secret in what would be published fails the PR instead of the post-merge mirror.
      - name: Mirror export self-test (glob and denylist rules)
        if: hashFiles('scripts/mirror-export.mjs') != ''
        run: node scripts/mirror-export.mjs --self-test
      - name: Mirror dry run (real allowlist, denylist check)
        if: hashFiles('mirror.allowlist') != ''
        run: node scripts/mirror-export.mjs "$RUNNER_TEMP/export"
      - name: Scan the mirror dry-run export for secrets
        if: hashFiles('mirror.allowlist') != ''
        run: gitleaks dir --redact --no-banner --verbose "$RUNNER_TEMP/export"
